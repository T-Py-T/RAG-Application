# .github/workflows/ci.yml
# Validates the HomeScope backend and frontend only when a pull request is active.
# It does not run on pushes, schedules, manual dispatches, releases, or deployments.
name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install --requirement backend/requirements-test.txt
      - name: Run backend tests
        run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
          run_install: false
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test
      - name: Check formatting
        working-directory: frontend
        run: pnpm lint
      - name: Check types
        working-directory: frontend
        run: pnpm typecheck
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
