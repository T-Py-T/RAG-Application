# .pre-commit-config.yaml
# Runs repository formatting, static analysis, file hygiene, and credential checks.
# It does not install Git hooks automatically or invoke any hosted workflow.
repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]

  - repo: local
    hooks:
      - id: frontend-format
        name: frontend format check
        entry: pnpm --dir frontend lint
        language: system
        pass_filenames: false
        files: ^frontend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements
        language: python

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.1
    hooks:
      - id: mypy
        additional_dependencies: [fastapi==0.115.12]
        files: ^backend/
        args: ["--ignore-missing-imports", "--strict"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^frontend/pnpm-lock\.yaml$
